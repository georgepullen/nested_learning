name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Verify docs path references
        run: uv run python scripts/checks/verify_docs_refs.py

      - name: Guard tracked file sizes / artifact extensions
        run: bash scripts/checks/check_git_tracked_sizes.sh

      - name: Verify scripts/data help exits cleanly
        run: bash scripts/checks/check_data_script_help.sh

      - name: Pytest
        run: uv run pytest

      - name: Fidelity telemetry validator fixtures
        run: |
          uv run python scripts/checks/validate_fidelity_telemetry.py \
            --log tests/data/telemetry/passing_metrics.json
          if uv run python scripts/checks/validate_fidelity_telemetry.py \
            --log tests/data/telemetry/failing_missing_layer_metrics.json; then
            echo "Expected telemetry validator to fail on missing layer metrics."
            exit 1
          fi

      - name: Optional throughput regression guard (GPU artifacts)
        env:
          PERF_GUARD_DIR: ${{ vars.PERF_GUARD_DIR }}
        run: |
          if [ -z "${PERF_GUARD_DIR:-}" ]; then
            echo "Skipping optional throughput guard; set repository variable PERF_GUARD_DIR to enable."
            exit 0
          fi
          for req in \
            bench_medium_shared_b1.json \
            bench_medium_per_sample_list_b4.json \
            bench_medium_tensorized_cms_b4.json; do
            if [ ! -f "${PERF_GUARD_DIR}/${req}" ]; then
              echo "Missing throughput artifact: ${PERF_GUARD_DIR}/${req}"
              exit 1
            fi
          done
          uv run python scripts/checks/validate_throughput_gate.py \
            --label "ci-medium" \
            --b1-json "${PERF_GUARD_DIR}/bench_medium_shared_b1.json" \
            --list-json "${PERF_GUARD_DIR}/bench_medium_per_sample_list_b4.json" \
            --tensorized-json "${PERF_GUARD_DIR}/bench_medium_tensorized_cms_b4.json" \
            --min-list-ratio 1.45 \
            --min-b1-ratio 1.8

  cpu-ddp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: CPU DDP smoke (gloo backend)
        run: bash scripts/run_cpu_ddp_smoke.sh

  passkey-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run synthetic passkey memorization test
        run: bash scripts/tests/run_passkey_smoke.sh

  fidelity-subset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.8"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run fidelity subset + compliance report
        run: bash scripts/checks/run_fidelity_ci_subset.sh
